groups:
  - name: chaos-app
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[30s]))
            / sum(rate(http_requests_total[30s])) > 0.3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "chaos-app error rate at {{ $value | humanizePercentage }}"
          description: "{{ $value | humanizePercentage }} of requests returned 5xx over the last 30s (alert threshold: 30%, sustained for 30s)."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[30s])) by (le)) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "chaos-app p95 latency at {{ $value | humanizeDuration }}"
          description: "95th percentile latency is {{ $value | humanizeDuration }} (alert threshold: 1s, sustained for 30s)."

      - alert: ServiceDown
        expr: up{job="chaos-app"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "chaos-app is unreachable"
          description: "Prometheus cannot scrape chaos-app."
